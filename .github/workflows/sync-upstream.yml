name: Sync Upstream
on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: |
          git remote add upstream https://github.com/jaywcjlove/linux-command.git
          git fetch upstream master
          git rebase upstream/master
      - run: git push origin master
