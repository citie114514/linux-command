name: Sync Upstream

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-upstream
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync with upstream jaywcjlove/linux-command
        run: |
          set -euo pipefail

          # merge/rebase 都要创建提交对象；runner 默认没有身份，
          # 缺 user.name/user.email 会 fatal: empty ident name (exit 128)。
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git remote add upstream https://github.com/jaywcjlove/linux-command.git 2>/dev/null \
            || git remote set-url upstream https://github.com/jaywcjlove/linux-command.git

          # 上游 tag 很多，只取 master
          git fetch --no-tags upstream master

          if git merge-base --is-ancestor upstream/master HEAD; then
            echo "已包含 upstream/master，无需同步。"
          else
            # 用 merge 而不是 rebase：本 fork 有自己的提交（workflow / sitemap 等），
            # rebase 会重写本地提交哈希，导致随后 push 非快进被拒。
            git merge --no-edit upstream/master
          fi

      - name: Push
        run: |
          set -euo pipefail

          # ci.yml 会在 push 后由机器人追加 doc 提交，origin 可能在本次运行期间前进，
          # 所以推送前先整合 origin，并允许重试。
          for i in 1 2 3; do
            git fetch --no-tags origin master
            git merge --no-edit FETCH_HEAD
            if git push origin HEAD:master; then
              echo "已同步到 origin/master"
              exit 0
            fi
            echo "push 被拒（origin 又前进了），第 $i 次重试…"
            sleep $((i * 5))
          done

          echo "重试 3 次仍无法推送" >&2
          exit 1
